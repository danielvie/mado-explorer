[package]
name = "mado-image-preview"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
# Allocation/range evidence in HANDOFF.md is version-specific. Keep these transitive
# dependencies pinned even when this component is later added to another workspace.
image-webp = "=0.2.4"
png = "=0.18.1"
zune-jpeg = "=0.5.15"
