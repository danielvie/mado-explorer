version: '3'

tasks:
  default:
    desc: List notification component tasks
    dir: ../..
    cmds:
      - task --taskfile components/directory-watch/Taskfile.yml --list
  run:
    desc: Exercise the real native Service using an owned parent and target
    dir: ../..
    cmds:
      - cargo test --locked --manifest-path components/directory-watch/Cargo.toml --target-dir target/p17 native_service_create_rename_delete_root_recreation_and_stop -- --nocapture
  test:
    desc: Test replacement service only, including native lifecycle and overflow
    dir: ../..
    cmds:
      - cargo test --locked --manifest-path components/directory-watch/Cargo.toml --target-dir target/p17 -- --nocapture
  check:
    desc: Check formatting and locked all-target compilation
    dir: ../..
    cmds:
      - cargo fmt --manifest-path components/directory-watch/Cargo.toml --check
      - cargo check --locked --all-targets --manifest-path components/directory-watch/Cargo.toml --target-dir target/p17
  diagnostic-notify:
    desc: Run preserved notify 8.2 diagnostic, EXPECTED FAILURE for silent native overflow
    dir: ../..
    cmds:
      - cargo test --locked --manifest-path components/directory-watch/diagnostic-notify/Cargo.toml --target-dir target/p17-diagnostic-notify -- --nocapture
  clean:
    desc: Remove only generated target/p17 service output
    dir: ../..
    cmds:
      - cargo clean --manifest-path components/directory-watch/Cargo.toml --target-dir target/p17
  clean:diagnostic:
    desc: Remove only generated target/p17-diagnostic-notify output
    dir: ../..
    cmds:
      - cargo clean --manifest-path components/directory-watch/diagnostic-notify/Cargo.toml --target-dir target/p17-diagnostic-notify
