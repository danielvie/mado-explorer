version: '3'

vars:
  ROOT: '{{.TASKFILE_DIR}}/../..'

tasks:
  default:
    desc: List component tasks
    cmds:
      - task --taskfile '{{.TASKFILE}}' --list
  run:
    desc: Run the safe headless controlled routing check, no DLL or GUI
    dir: '{{.ROOT}}'
    cmds:
      - cargo test --locked --offline --manifest-path components/pdf-preview-service/Cargo.toml --target-dir target/p11 --lib coalesced_fifo_is_fair_to_independent_targets
  check:
    desc: Check formatting and compile all component targets offline
    dir: '{{.ROOT}}'
    cmds:
      - cargo fmt --manifest-path components/pdf-preview-service/Cargo.toml -- --check
      - cargo check --locked --offline --all-targets --manifest-path components/pdf-preview-service/Cargo.toml --target-dir target/p11
  test:
    desc: Test component routing, stop ownership and CPU buffer admission
    dir: '{{.ROOT}}'
    cmds:
      - cargo test --locked --offline --manifest-path components/pdf-preview-service/Cargo.toml --target-dir target/p11
  native:
    desc: Opt-in public Service native check; requires the exact documented managed PDFium 7881 DLL, verifies archive/DLL hashes and build flags before loading
    dir: '{{.ROOT}}'
    requires:
      vars: [TRUSTED_PDFIUM]
    env:
      MADO_P14_TRUSTED_PDFIUM: '{{.TRUSTED_PDFIUM}}'
    cmds:
      - cargo test --locked --offline --manifest-path components/pdf-preview-service/Cargo.toml --target-dir target/p11 --test native_service native_service_managed_pdfium_7881 -- --exact --ignored --nocapture
  clean:
    desc: Remove only the generated root target/p11 build output
    dir: '{{.ROOT}}'
    cmds:
      - cargo clean --manifest-path components/pdf-preview-service/Cargo.toml --target-dir target/p11
