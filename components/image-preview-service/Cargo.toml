[package]
name = "mado-image-preview-service"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
mado-pdf-preview-service = { path = "../pdf-preview-service" }
windows-sys = { version = "=0.61.2", features = ["Wdk_Foundation", "Wdk_Storage_FileSystem", "Win32_Foundation", "Win32_Security", "Win32_Security_Cryptography", "Win32_Storage_FileSystem", "Win32_System_IO", "Win32_System_Diagnostics_Debug", "Win32_System_JobObjects", "Win32_System_Memory", "Win32_System_Pipes", "Win32_System_Threading"] }
# Only the helper binary imports the codecs. No parent decoding API.
image = { version = "=0.25.10", default-features = false, features = ["png", "jpeg", "webp"] }
image-webp = "=0.2.4"
png = "=0.18.1"
zune-jpeg = "=0.5.15"

[[bin]]
name = "mado-image-helper"
path = "src/helper/main.rs"

[[bin]]
name = "p21-selfcheck"
path = "src/selfcheck.rs"
