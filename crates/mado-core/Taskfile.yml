version: '3'

tasks:
  default:
    desc: List available core tasks
    cmds:
      - task --list
  run:
    desc: Run the generated-fixture browsing demo without GUI or terminal frameworks
    cmds:
      - cargo run --locked --offline --example browsing
  test:
    desc: Run shared native browsing regressions and the generated-fixture end-to-end check
    cmds:
      - cargo test --locked --offline
  check:
    desc: Check formatting and all core targets without UI dependencies
    cmds:
      - cargo fmt -- --check
      - cargo check --locked --offline --all-targets
  clean:
    desc: Remove only core Cargo dev, release and documentation build output
    cmds:
      - cargo clean --offline --profile dev
      - cargo clean --offline --profile release
      - cargo clean --offline --doc
