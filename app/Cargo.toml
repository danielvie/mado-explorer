[package]
name = "wayfarer-files"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
eframe = { version = "=0.36.2", default-features = false, features = ["accesskit", "default_fonts", "wgpu"] }
raw-window-handle = "=0.6.2"
windows = { version = "=0.62.2", features = ["Win32_Foundation", "Win32_System_Ole", "Win32_System_Threading", "Win32_UI_Shell", "Win32_UI_WindowsAndMessaging", "Win32_System_Com", "Win32_UI_Shell_Common", "Win32_UI_Input_KeyboardAndMouse", "Win32_Storage_FileSystem", "Win32_System_Com_StructuredStorage", "Win32_System_Variant", "Win32_Graphics_Gdi", "Win32_Graphics_Imaging", "Win32_System_DataExchange", "Win32_System_Memory", "Win32_System_SystemServices", "Win32_UI_Shell_PropertiesSystem", "Win32_System_Time"] }

egui_extras = "=0.36.2"
egui_dock = "=0.21.1"
serde = { version = "=1.0.229", features = ["derive"] }
serde_json = "=1.0.151"
windows-core = "=0.62.2"

notify = "=8.2.0"
