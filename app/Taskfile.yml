version: '3'

tasks:
  default:
    desc: List application tasks
    cmds:
      - task --list
  run:
    desc: Run Wayfarer Files
    cmds:
      - cargo run
  build:
    desc: Build Wayfarer Files
    cmds:
      - cargo build
  test:
    desc: Check formatting, lint, and tests
    cmds:
      - cargo fmt -- --check
      - cargo clippy --all-targets -- -D warnings
      - cargo test
  clean:
    desc: Remove this application's Cargo build output
    cmds:
      - cargo clean

  release:
    desc: Build the release executable with the embedded Windows manifest
    cmds:
      - cargo build --locked --release
