[package]
name = "mado-explorer"
version = "0.1.0"
edition = "2024"
rust-version = "1.95"
publish = false

[dependencies]
eframe = { version = "0.36.2", default-features = false, features = ["default_fonts", "wgpu", "accesskit"] }
# Human-readable UTC modification timestamps; no platform timezone or filesystem calls.
time = { version = "0.3", default-features = false, features = ["std"] }
