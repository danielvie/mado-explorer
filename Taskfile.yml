version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  run:
    desc: Launch the Rust explorer (optionally pass a folder after --)
    cmds:
      - cargo run -- {{.CLI_ARGS}}

  test:
    desc: Run automated Rust checks and rolling workflow guard checks
    cmds:
      - cargo test
      - task workflow:test

  workflow:test:
    desc: Check rolling workflow ownership and promotion guards without launching agents
    cmds:
      - node .pi/workflows/rolling-feature-wave.test.cjs

  test:fonts:
    desc: Run complete installed-font coverage on the Windows reference host
    cmds:
      - cargo test font_fallback::tests::s006a_installed_windows_loader_covers_japanese_and_common_unicode -- --ignored --exact

  design:
    desc: Open the editable layout in Mado Excalidraw
    cmds:
      - mado-excalidraw run design/file-explorer-layout.excalidraw

  design-test:
    desc: Validate layout JSON, frame references and editable elements
    cmds:
      - >-
        node -e "const fs=require('node:fs'),a=require('node:assert/strict'),s=JSON.parse(fs.readFileSync('design/file-explorer-layout.excalidraw','utf8')),e=s.elements,ids=new Set(e.map(x=>x.id)),frames=new Set(e.filter(x=>x.type==='frame').map(x=>x.id));a.equal(s.type,'excalidraw');a.equal(s.version,2);a.equal(ids.size,e.length);a.equal(frames.size,3);a.ok(e.every(x=>!x.isDeleted&&!x.locked&&(!x.frameId||frames.has(x.frameId))&&Number.isFinite(x.x)&&Number.isFinite(x.y)&&x.width>=0&&x.height>=0));a.ok(e.filter(x=>x.type==='text').every(x=>x.fontFamily===5&&x.fontSize>=16));console.log(e.length+' editable elements; 3 frames; checks passed');"

  clean:
    desc: Remove only generated Rust build output in target
    cmds:
      - cargo clean --target-dir target
