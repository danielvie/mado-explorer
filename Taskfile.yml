version: '3'

tasks:
  default:
    desc: List available tasks
    cmds:
      - task --list

  run:
    desc: Launch the Rust explorer (optionally pass a folder after --)
    cmds:
      - cargo run -- {{.CLI_ARGS}}

  test:
    desc: Run application, accepted backend and rolling workflow guard checks
    cmds:
      - cargo test
      - task workflow:test
      - task test:pdf
      - task test:summary
      - task test:conflict
      - task test:raster
      - task test:drawer
      - task test:source
      - task test:pdf-service
      - task test:pdf-controls
      - task test:keep-both
      - task test:confirmation
      - task test:clipboard
      - task test:create
      - task test:watch
      - task test:clipboard-probe
      - task test:image-service

  test:image-service:
    desc: Build our capped helper and test owned codec, protocol, shared-budget and native resource lifetimes
    cmds:
      - cargo build --locked --offline --manifest-path components/image-preview-service/Cargo.toml --target-dir target/p21 --bin mado-image-helper
      - cargo test --locked --offline --manifest-path components/image-preview-service/Cargo.toml --target-dir target/p21

  test:clipboard-probe:
    desc: Test blocked probe privacy guards and owned fixture retention only, no station or clipboard calls
    cmds:
      - cargo test --locked --offline --manifest-path validation/clipboard-capability/Cargo.toml --target-dir target/p22/build

  test:watch:
    desc: Test reviewed native notification service with owned fixtures, excluding known-failing legacy notify diagnostic
    cmds:
      - cargo test --locked --manifest-path components/directory-watch/Cargo.toml --target-dir target/p17

  test:native-workspace:
    desc: Check owned native workspace save and restart without personal settings or clipboard
    cmds:
      - cargo build --locked
      - pwsh -NoProfile -ExecutionPolicy Bypass -File handoff/s011-native-smoke.ps1 -ExpectWrites

  capture:workspace:
    desc: Capture only a launched own window using the retained V001 fixture, no desktop or clipboard
    cmds:
      - cargo build --locked
      - pwsh -NoProfile -ExecutionPolicy Bypass -File handoff/s016-owned-capture.ps1

  test:create:
    desc: Test reviewed create-only local NTFS backend using owned disposable fixtures
    cmds:
      - cargo test --locked --manifest-path components/fs-create/Cargo.toml --target-dir target/p18 -- --test-threads=1

  test:clipboard:
    desc: Test accepted file packets and owned native memory without global clipboard access
    cmds:
      - cargo test --locked --manifest-path components/file-clipboard/Cargo.toml --target-dir target/p05

  test:confirmation:
    desc: Test accepted immutable deletion-intent confirmations without OS deletion
    cmds:
      - cargo test --locked --manifest-path components/delete-confirmation/Cargo.toml --target-dir target/p15

  test:keep-both:
    desc: Test accepted read-only native Keep both name planning
    cmds:
      - cargo test --locked --manifest-path components/keep-both-name/Cargo.toml --target-dir target/p13

  test:pdf-controls:
    desc: Test accepted PDF page metadata, drafts and input epochs
    cmds:
      - cargo test --locked --manifest-path components/pdf-controls/Cargo.toml --target-dir target/p10

  test:pdf-service:
    desc: Test accepted background PDF routing and CPU buffer admission
    cmds:
      - cargo test --locked --manifest-path components/pdf-preview-service/Cargo.toml --target-dir target/p11

  test:source:
    desc: Test accepted read-only source identities with owned native fixtures
    cmds:
      - cargo test --locked --manifest-path components/fs-source-snapshot/Cargo.toml --target-dir target/p12 -- --test-threads=1

  test:drawer:
    desc: Test accepted operation drawer queue, reports and bounded input ownership
    cmds:
      - cargo test --locked --manifest-path components/operation-drawer/Cargo.toml --target-dir target/p09

  test:raster:
    desc: Test accepted raster controls, ordered gestures and modal ownership
    cmds:
      - cargo test --locked --manifest-path components/raster-viewport/Cargo.toml --target-dir target/p07

  test:conflict:
    desc: Test accepted conflict controls and bounded request-epoch presentation
    cmds:
      - cargo test --locked --manifest-path components/conflict-dialog/Cargo.toml --target-dir target/p08

  test:summary:
    desc: Test accepted selection-summary controls with generated metadata
    cmds:
      - cargo test --locked --manifest-path components/selection-summary/Cargo.toml --target-dir target/p06

  test:pdf:
    desc: Test the accepted PDF backend without loading a native renderer
    cmds:
      - cargo test --locked --manifest-path components/pdf-preview/Cargo.toml --target-dir target/p03

  workflow:test:
    desc: Check rolling workflow ownership and promotion guards without launching agents
    cmds:
      - node .pi/workflows/rolling-feature-wave.test.cjs

  test:fonts:
    desc: Run complete installed-font coverage on the Windows reference host
    cmds:
      - cargo test font_fallback::tests::s006a_installed_windows_loader_covers_japanese_and_common_unicode -- --ignored --exact

  design:
    desc: Open the editable layout in Mado Excalidraw
    cmds:
      - mado-excalidraw run design/file-explorer-layout.excalidraw

  design-test:
    desc: Validate layout JSON, frame references and editable elements
    cmds:
      - >-
        node -e "const fs=require('node:fs'),a=require('node:assert/strict'),s=JSON.parse(fs.readFileSync('design/file-explorer-layout.excalidraw','utf8')),e=s.elements,ids=new Set(e.map(x=>x.id)),frames=new Set(e.filter(x=>x.type==='frame').map(x=>x.id));a.equal(s.type,'excalidraw');a.equal(s.version,2);a.equal(ids.size,e.length);a.equal(frames.size,3);a.ok(e.every(x=>!x.isDeleted&&!x.locked&&(!x.frameId||frames.has(x.frameId))&&Number.isFinite(x.x)&&Number.isFinite(x.y)&&x.width>=0&&x.height>=0));a.ok(e.filter(x=>x.type==='text').every(x=>x.fontFamily===5&&x.fontSize>=16));console.log(e.length+' editable elements; 3 frames; checks passed');"

  clean:
    desc: Remove only generated Rust build output in target
    cmds:
      - cargo clean --target-dir target
